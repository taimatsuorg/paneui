<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icons · PaneUI</title>
    <meta name="description" content="Search, copy, and publish rounded 24px icons via web or MCP." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var e = document.documentElement;
          e.classList.toggle("dark", d);
          e.style.colorScheme = d ? "dark" : "light";
          var loc = localStorage.getItem("site-locale");
          if (loc === "zh" || (!loc && /^zh\b/i.test(navigator.language || ""))) {
            e.lang = "zh-CN";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
